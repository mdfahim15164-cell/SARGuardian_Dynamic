name: RiverShift NISAR GCOV catalogue audit

on:
  push:
    branches:
      - feature/river-shift-engine-label
    paths:
      - "tools/river_shift/**"
      - "data-audit/**"
      - ".github/workflows/river-shift-gcov-audit.yml"
  workflow_dispatch:
    inputs:
      aoi_wkt:
        description: Candidate or approved AOI as one WGS84 POLYGON WKT
        required: true
        type: string
        default: "POLYGON ((89.62 24.43, 89.78 24.43, 89.78 24.68, 89.62 24.68, 89.62 24.43))"
      start_date:
        description: Earliest acquisition date (YYYY-MM-DD)
        required: true
        type: string
        default: "2026-06-17"
      end_date:
        description: Latest acquisition date (YYYY-MM-DD)
        required: true
        type: string
        default: "2026-10-31"
      maturity:
        description: Never mix BETA and PROVISIONAL products in one time series
        required: true
        type: choice
        options: [PROVISIONAL, BETA, ALL]
        default: PROVISIONAL
      frame_coverage:
        description: Filter NISAR frame completeness; ALL is safest for initial coverage audit
        required: true
        type: choice
        options: [ALL, FULL, PARTIAL]
        default: ALL
      main_band_polarization:
        description: Optional Frequency-A polarization filter
        required: false
        type: choice
        options: [Any, HH, HH+HV, HH+VV, HH+HV+VH+VV, VV, VV+VH, LH+LV, RH+RV]
        default: Any
      flight_direction:
        description: Optional orbit direction filter
        required: false
        type: choice
        options: [Any, ASCENDING, DESCENDING]
        default: Any
      minimum_aoi_coverage_percent:
        description: Minimum footprint coverage required on each acquisition date
        required: true
        type: string
        default: "90"

permissions:
  contents: read

concurrency:
  group: river-shift-gcov-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalogue-and-coverage-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/river_shift/requirements.txt

      - name: Install RiverShift catalogue dependencies
        working-directory: tools/river_shift
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate inputs and discover official ASF GCOV products
        id: discover
        working-directory: tools/river_shift
        env:
          AOI_WKT: ${{ github.event.inputs.aoi_wkt || 'POLYGON ((89.62 24.43, 89.78 24.43, 89.78 24.68, 89.62 24.68, 89.62 24.43))' }}
          START_DATE: ${{ github.event.inputs.start_date || '2026-06-17' }}
          END_DATE: ${{ github.event.inputs.end_date || '2026-10-31' }}
          MATURITY: ${{ github.event.inputs.maturity || 'PROVISIONAL' }}
          FRAME_COVERAGE: ${{ github.event.inputs.frame_coverage || 'ALL' }}
          MAIN_BAND_POLARIZATION: ${{ github.event.inputs.main_band_polarization || 'Any' }}
          FLIGHT_DIRECTION: ${{ github.event.inputs.flight_direction || 'Any' }}
          MINIMUM_COVERAGE: ${{ github.event.inputs.minimum_aoi_coverage_percent || '90' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/river-shift-audit"
          args=(
            --aoi-wkt "$AOI_WKT"
            --start-date "$START_DATE"
            --end-date "$END_DATE"
            --maturity "$MATURITY"
            --frame-coverage "$FRAME_COVERAGE"
            --max-results 1000
            --timeout 60
            --out "$RUNNER_TEMP/river-shift-audit/gcov-catalogue-manifest.json"
          )
          if [[ -n "$MAIN_BAND_POLARIZATION" && "$MAIN_BAND_POLARIZATION" != "Any" ]]; then
            args+=(--main-band-polarization "$MAIN_BAND_POLARIZATION")
          fi
          if [[ -n "$FLIGHT_DIRECTION" && "$FLIGHT_DIRECTION" != "Any" ]]; then
            args+=(--flight-direction "$FLIGHT_DIRECTION")
          fi
          python discover_gcov_products.py "${args[@]}"

          python audit_gcov_acquisitions.py \
            --catalogue "$RUNNER_TEMP/river-shift-audit/gcov-catalogue-manifest.json" \
            --minimum-dates 3 \
            --minimum-aoi-coverage-percent "$MINIMUM_COVERAGE" \
            --out "$RUNNER_TEMP/river-shift-audit/gcov-time-series-audit.json"

          python - "$RUNNER_TEMP/river-shift-audit/gcov-catalogue-manifest.json" "$RUNNER_TEMP/river-shift-audit/gcov-time-series-audit.json" <<'PY'
          import json, sys
          catalogue = json.load(open(sys.argv[1], encoding="utf-8"))
          audit = json.load(open(sys.argv[2], encoding="utf-8"))
          print("GCOV_CATALOGUE_PRODUCTS=" + str(catalogue.get("product_count")))
          print("GCOV_TIME_SERIES_STATUS=" + str(audit.get("status")))
          print("GCOV_QUALIFYING_GROUPS=" + str(audit.get("metrics", {}).get("qualifying_group_count")))
          PY

      - name: Write audit findings to the workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          catalogue="$RUNNER_TEMP/river-shift-audit/gcov-catalogue-manifest.json"
          audit="$RUNNER_TEMP/river-shift-audit/gcov-time-series-audit.json"
          {
            echo "# RiverShift NISAR GCOV feasibility audit"
            echo ""
            if [[ -s "$catalogue" ]]; then
              python - "$catalogue" "$audit" <<'PY'
          import json, sys
          c=json.load(open(sys.argv[1], encoding="utf-8"))
          print("- **ASF catalogue products:** {}".format(c.get("product_count")))
          print("- **Maturity filter:** {}".format(c.get("maturity_filter")))
          print("- **Frame coverage filter:** {}".format(c.get("query", {}).get("frame_coverage")))
          if len(sys.argv)>2:
              a=json.load(open(sys.argv[2], encoding="utf-8"))
              print("- **Time-series feasibility:** {}".format(a.get("status")))
              print("- **Qualifying compatible stacks:** {}".format(a.get("metrics", {}).get("qualifying_group_count")))
              print("- **AOI area:** {} km²".format(a.get("spatial_validation", {}).get("aoi_area_km2")))
              print("")
              for warning in a.get("quality", {}).get("warnings", []):
                  print("- **Caveat:** {}".format(warning))
          PY
            else
              echo "Catalogue manifest was not created; inspect the discovery step logs."
            fi
            echo ""
            echo "> Catalogue availability and footprint coverage are feasibility evidence only. No raster was downloaded, no flood mask was calculated and no real-world accuracy is claimed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw catalogue manifest and time-series feasibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-shift-gcov-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/river-shift-audit
          if-no-files-found: warn
          retention-days: 30
