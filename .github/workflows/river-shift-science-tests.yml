name: RiverShift scientific tests

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/river_shift/**"
      - ".github/workflows/river-shift-science-tests.yml"
  push:
    branches: [main, feature/river-shift-engine-label]
    paths:
      - "tools/river_shift/**"
      - ".github/workflows/river-shift-science-tests.yml"

permissions:
  contents: read

concurrency:
  group: river-shift-science-tests-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  scientific-regression:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/river_shift
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/river_shift/requirements.txt

      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"

      - name: Run RiverShift scientific regression suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
